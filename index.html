<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Onde Vai?</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#204558;--lime:#CBFFA6;--blue:#A8E0F2;--gray:#D9D9D9;--bar:#F5F5F7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;font-size:calc(min(100vw,430px)/118.8);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);font-family:Montserrat,system-ui,sans-serif;color:#000;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
button{font:inherit;cursor:pointer;border:0;padding:0;color:inherit}input{font:inherit}p,h2,h3{margin:0}
header{background:var(--bar);height:18.8rem;flex:none;position:relative}
header #sair{position:absolute;left:6.6rem;top:3.3rem;width:11.4rem;height:11.4rem;border-radius:50%;background:#bbb;font-weight:800;font-size:6.3rem;font-family:Montserrat}
header .b1{position:absolute;left:20.7rem;top:5.2rem;width:53.9rem;height:5.6rem;border-radius:2.8rem;background:#bbb;color:#333;font-weight:600;font-size:2.88rem;line-height:5.6rem;padding:0 2.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .b2{position:absolute;left:20.7rem;top:11.9rem;width:45.6rem;height:1.9rem;border-radius:1rem;background:#bbb}
main{flex:1;overflow-y:auto;padding-bottom:5.1rem;display:flex;flex-direction:column}main>*{flex:none}
nav{flex:none;position:relative;background:var(--bar)}nav img{display:block;width:100%}
nav div{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}nav button{background:none}
.empty{color:#fff;opacity:.8;font-size:3.06rem;margin:2rem 6.6rem}
.toast{position:absolute;left:50%;bottom:26rem;transform:translateX(-50%);background:#000;color:#fff;font-size:2.88rem;padding:2rem 3.2rem;border-radius:4rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}.toast.on{opacity:.92}
/* login */
#login{position:absolute;inset:0;background:var(--bg);z-index:5;overflow-y:auto}
.hw{position:relative;width:100%}.hw>img{display:block;width:100%}
.pp{position:absolute;width:8.6rem;height:8.6rem;border-radius:50%;background:#000;top:calc(65.35% - 4.3rem);transition:transform .08s}
.lf{padding-top:16rem;min-height:calc(257.6rem - 149.2rem)}
.lf label{display:block;height:9.5rem;line-height:9.5rem;margin-left:23.7rem;color:#fff;font-weight:600;font-size:5.04rem}
.lf input{display:block;width:71.8rem;height:11.6rem;margin:0 0 2.7rem 23.5rem;border:0;border-radius:5.8rem;background:var(--gray);padding:0 3rem;font-size:3.24rem}
.lf input#sn{margin-bottom:0}
.err{height:9.7rem;margin-left:23.7rem;display:flex;align-items:center;color:#ffb4a8;font-size:2.7rem}
.btn{display:block;width:71.9rem;height:11.6rem;margin-left:22.6rem;border-radius:5.8rem;background:var(--lime);color:var(--bg);font-weight:600;font-size:5.76rem}
.dir{text-align:center;color:#fff;font-size:2.79rem;padding:11.2rem 0 6rem;font-weight:400}
/* escanear */
.greet{margin:28.5rem 6.7rem 0 6.6rem;height:19.3rem;border-radius:9.7rem;background:var(--lime);display:flex;align-items:center;padding-left:2.5rem;gap:2.4rem;font-weight:700;font-size:3.6rem}
.greet .c{width:11.4rem;height:11.4rem;border-radius:50%;background:var(--bg);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:5.4rem;flex:none}
.scanc{position:relative;margin:6.7rem 6.7rem 6rem 6.6rem;height:89.7rem;border-radius:7rem;background:var(--gray)}
.scanc h2{position:absolute;top:9rem;left:0;right:0;text-align:center;font-weight:700;font-size:4.68rem;line-height:6.4rem}
.qr{position:absolute;left:32.6rem;top:23.2rem;width:40.1rem;height:41.1rem;border-radius:7rem;overflow:hidden}
.qr img{display:block;width:100%;height:100%}.qr video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam{position:absolute;left:86.4rem;top:62.5rem;width:10.2rem;height:8rem;background:none}.cam img{display:block;width:100%}
.row{position:absolute;left:3.3rem;top:72.6rem;width:97.5rem;height:10.2rem;display:flex;gap:3.3rem}
.row input{flex:1;min-width:0;border:0;background:#ececec;border-radius:2.5rem;padding:0 4.6rem;font-size:2.65rem;font-weight:400}
.row input::placeholder{color:#999;font-size:2.65rem}
.row button{width:21.5rem;background:var(--lime);border-radius:2.5rem;font-size:3.51rem;font-weight:500}
.hint{position:absolute;left:3.3rem;right:3.3rem;top:91.6rem;font-size:2.43rem;color:#fff;opacity:.85;text-align:center}.hint a{color:var(--lime);font-weight:700;text-decoration:underline;cursor:pointer}
h3{color:#fff;font-weight:700;font-size:4.68rem;line-height:6.4rem}
main>h3:not(.fh){margin:auto 0 3.4rem 6.7rem}
.nota{display:flex;align-items:center;width:calc(100% - 13.3rem);margin:0 6.7rem 1.5rem 6.6rem;height:19.3rem;border-radius:7rem;background:var(--lime);padding:0 4.8rem 0 4.2rem;text-align:left}
.nota img{width:8.3rem;height:8.7rem;flex:none;margin-right:3.4rem}
.nota .t{flex:1;min-width:0}.nota .t b{display:block;font-size:3.78rem;font-weight:700;line-height:5.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nota .t span{display:block;font-size:3.78rem;font-weight:500;line-height:5.6rem}
.nota .v{display:flex;flex-direction:column;align-items:flex-end;margin-left:1rem}.nota .p{font-size:3.78rem;font-weight:500;line-height:5.2rem}
.tag{background:var(--blue);border:.25rem solid var(--bg);border-radius:1rem;font-weight:700;font-size:2.7rem;padding:.3rem 1.1rem;color:var(--bg);margin-top:.3rem;white-space:nowrap}
.bl{margin:28.5rem 6.6rem 6rem;background:var(--blue);border-radius:7rem;padding:5rem}.bl h2{font-size:3.96rem;margin-bottom:1rem}.bl p{font-size:3.24rem}
/* nota */
.ntop{margin:28.2rem 0 0 5.2rem;width:106.1rem;height:19.3rem;border-radius:9.7rem;background:var(--lime);display:flex;justify-content:space-between;align-items:center;padding:0 4.2rem 0 4.5rem}
.ntop b{display:block;font-size:4.23rem;font-weight:700;line-height:6.2rem}.ntop span{display:block;font-size:3.6rem;font-weight:500;line-height:6.2rem}.ntop .r{text-align:right}
.g1,.g2{background:var(--gray);border-radius:7.5rem}
.g1{margin:6.7rem 0 0 6.9rem;width:105rem;height:47.2rem;padding:5.5rem 0 0 5.2rem}
.g2{margin:6.7rem 0 0 6.6rem;width:105.5rem;height:47.2rem;padding:5.5rem 0 0 0}
.g1 h2,.g2 h2{font-size:4.23rem;font-weight:700;line-height:5.6rem}.g2 h2{margin-left:5.5rem}
.split{margin:.6rem 0 0 -2.4rem;width:98.3rem;height:7.9rem;border:.4rem solid #000;border-radius:4rem;overflow:hidden;display:flex;font-weight:700;font-size:3.6rem}
.split div{display:grid;place-items:center}.split .a{width:71%;background:var(--lime);border-right:.4rem solid #000}.split .b{flex:1;background:var(--blue)}
.two{display:flex;gap:2.1rem;margin:6.5rem 0 0 -1rem}
.mini{width:47.4rem;height:11.9rem;background:#fff;border:.25rem solid var(--lime);border-radius:2.5rem;text-align:center;font-size:2.97rem;line-height:4rem;padding-top:1.1rem}.mini.b{border-color:var(--blue)}.mini b{display:block;font-size:3.42rem;font-weight:700;line-height:4.6rem;margin-top:.6rem}
.tr{margin:0 0 2rem 5.3rem;width:92.8rem;height:12.1rem;border:.3rem solid #000;border-radius:2.8rem;background:var(--bg);color:#fff;display:flex;align-items:center;padding:0 4.5rem 0 2.8rem}
.g2 h2+.tr{margin-top:3.5rem}
.tr strong{font-size:3.96rem;font-weight:600}.pill{background:#fff;color:#000;border-radius:3rem;height:6rem;line-height:5.4rem;padding:0 4.8rem;font-size:2.97rem;border:.3rem solid #1a3bd6;margin-left:3.1rem;font-weight:400}.pill.f{border-color:#3cc83c}
.tr .m{margin-left:auto;text-align:right;font-weight:700;font-size:2.79rem;line-height:3.8rem}.tr .m small{display:block;font-weight:400;font-size:2.7rem}
.go{display:flex;align-items:center;justify-content:space-between;margin:6.7rem 0 0 6.6rem;width:105.5rem;height:15.7rem;border-radius:7rem;background:var(--blue);padding:0 4rem 0 3.5rem;text-align:left;font-weight:700;font-size:3.69rem;color:#000;gap:1rem}.go svg{width:3.4rem;height:3.4rem;flex:none}
/* destino */
.dtop{margin:8.3rem 0 0 6.3rem;width:106.1rem;border-radius:7rem;background:var(--lime);padding:3.5rem 5rem 4.3rem 5.9rem}.dtop h2{font-size:3.69rem;line-height:5rem;font-weight:700}.dtop p{font-size:2.97rem;line-height:3.8rem;margin-top:1.1rem;font-weight:500}
.dg{margin:6.7rem 0 0 6.9rem;width:105rem;border-radius:7.5rem;background:var(--gray);padding:4.7rem 0 10.1rem}.dg h2{font-size:4.23rem;line-height:5.6rem;margin-left:7.3rem;font-weight:700;margin-bottom:3.2rem}
.dest{position:relative;margin:0 0 2.8rem 7.3rem;width:87.9rem;border-radius:3rem;color:#fff;padding:3rem 4rem 4.2rem 3.7rem}
.dest strong{display:block;font-size:3.69rem;line-height:4.4rem;font-weight:700}.dest p{font-size:2.97rem;line-height:4.1rem;margin-top:2.1rem;font-weight:500}
.dest .pill{position:absolute;right:3.6rem;top:2.9rem;height:4.5rem;line-height:3.9rem;padding:0 1.8rem;font-size:2.61rem;border:.3rem solid #7ed321;margin:0;border-radius:2.3rem;white-space:nowrap}
.sabia{margin:6.8rem 6.9rem 0 7.2rem;border-radius:4rem;background:#fff;padding:2.9rem 5rem 3.4rem}.sabia h2{font-size:3.69rem;line-height:5rem;font-weight:700}.sabia p{font-size:2.97rem;line-height:4.1rem;margin-top:.5rem;font-weight:500}
/* aprenda */
.l1{margin:8.3rem 0 0 7.2rem;width:104.9rem;border-radius:7rem;background:var(--blue);padding:5.1rem 3rem 5.5rem 3.9rem}.l1 h2{font-size:3.69rem;line-height:5rem;font-weight:700}.l1 p{font-size:3.24rem;line-height:5rem;margin-top:2.2rem;font-weight:500}
.l2{margin:6.5rem 0 0 6.9rem;width:105rem;border-radius:7.5rem;background:var(--lime);padding:7.8rem 4rem 8.5rem 4.5rem}.l2 h2{font-size:3.96rem;line-height:5.4rem;font-weight:600}.l2 p{font-size:3.42rem;line-height:5rem;margin:2.2rem 0 0 .5rem;font-weight:500}
.fh{margin:40.6rem 0 5.2rem 6.7rem}
.faq{margin:0 0 6.1rem 6.9rem;width:105rem;background:#fff;border-radius:3.5rem;overflow:hidden}
.faq button{width:100%;min-height:12.7rem;background:none;display:flex;align-items:center;justify-content:space-between;gap:2rem;text-align:left;font-weight:700;font-size:2.97rem;line-height:1;padding:1rem 5.4rem 1rem 4.1rem}
.faq svg{width:3.8rem;height:3.8rem;flex:none;transition:transform .2s}.faq.open svg{transform:rotate(180deg)}
.faq .ans{display:none;padding:0 4.1rem 3.4rem;font-size:2.79rem;line-height:1.5;font-weight:400}.faq.open .ans{display:block}
</style>
</head>

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const LOJAS=[['Supermercado Compre Bem','cart'],['Padaria Pão Quente','cart'],['Farmácia Vida','cart'],['Mercadinho do Bairro','cart']];
function buildNota(chave,demo){
  const h=hash(chave);const [nome,ic]=LOJAS[h%LOJAS.length];
  const valor=demo?50:Math.round((12+(h%26800)/100)*100)/100;
  const cnpj=chave.slice(6,20);
  return {id:chave,chave,loja:demo?'Supermercado Compre Bem':nome,cnpj:cnpj.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'),valor,ts:Date.now()};
}
function calc(n){
  const icms=Math.round(n.valor*18)/100,pis=Math.round(n.valor*9)/100,tot=Math.round((icms+pis)*100)/100;
  const sh=[36,25,20,19];let rest=tot;
  const dest=sh.map((p,i)=>{const v=i<3?Math.round(tot*p)/100:Math.round(rest*100)/100;rest-=v;return {p,v}});
  return {icms,pis,tot,liq:Math.round((n.valor-tot)*100)/100,dest};
}

  <div class="row"><input id="chave" inputmode="numeric" placeholder="Digite aqui o código da sua nota fiscal NFC-e"><button id="buscar">Consultar:</button></div>
  <div class="hint" id="hint">${S.hint||'Use a câmera ou <a id="demo">veja uma nota de exemplo</a>'}</div></div>
  <h3>NOTAS RECENTES:</h3>${S.notas.length?S.notas.slice(0,4).map(notaItem).join(''):'<p class="empty">Nenhuma nota ainda. Escaneie a primeira!</p>'}`;
}
function vNota(){
  const n=S.notas.find(x=>x.id===S.sel);
  if(!n)return `<div class="bl"><h2>Nenhuma nota selecionada</h2><p>Escaneie uma nota ou escolha uma abaixo.</p></div>${S.notas.map(notaItem).join('')}`;
  const c=calc(n);
  return `<div class="ntop"><div><b>${esc(n.loja)}</b><span>Data: ${dataFmt(n.ts).replace(' - ','  - ')}</span></div><div class="r"><span>Total Pago:</span><b>${brl(n.valor)}</b></div></div>
  <div class="g1"><h2>Divisão do Valor Pago</h2><div class="split"><div class="a">73%</div><div class="b">27%</div></div>
  <div class="two"><div class="mini">Valor do Produto sem Tributos<b>${brl(c.liq)}</b></div><div class="mini b">Total em Tributos<b>${brl(c.tot)}</b></div></div></div>
  <div class="g2"><h2>Detalhamentos dos Tributos:</h2>
  <div class="tr"><strong>ICMS</strong><span class="pill">Estadual</span><div class="m">${brl(c.icms)}<small>(18,0%)</small></div></div>
  <div class="tr"><strong>PIS / COFINS</strong><span class="pill f">Federal</span><div class="m">${brl(c.pis)}<small>(9,0%)</small></div></div></div>
  <button class="go" id="goDest"><span>Ver para onde esses ${brl(c.tot)} são destinados</span><svg viewBox="0 0 24 24"><path d="M8 3l9 9-9 9" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
}
const COR=['#204558','#2B5F78','#397A97','#4598BC'];
const DESC=[['Saúde Pública:','Vacinas, consultas no posto de saúde, medicamentos básicos e manutenção dos hospitais públicos.'],['Educação pública:','Merenda escolar, material didático e salários de professores de creches e escolas públicas.'],['Infraestrutura urbana','Iluminação da rua, pavimentação, limpeza urbana e transporte público.'],['Segurança e outros','Policiamento comunitário, bombeiros, praças e serviços administrativos.']];
function vDest(){
  const n=S.notas.find(x=>x.id===S.sel);
  if(!n)return `<div class="bl"><h2>Escolha uma nota</h2><p>Para ver o destino dos tributos, selecione uma nota fiscal.</p></div>${S.notas.map(notaItem).join('')||'<p class="empty">Escaneie uma nota na aba Escanear.</p>'}`;
  const c=calc(n);
  return `<div class="dtop"><h2>Para onde vai o seu dinheiro?</h2><p>Seus ${brl(c.tot)} em tributos desta compra são investidos assim:</p></div>
  <div class="dg"><h2>Destino dos tributos:</h2>${DESC.map((d,i)=>`<div class="dest" style="background:${COR[i]}"><strong>${d[0]}</strong><span class="pill">${brl(c.dest[i].v)} (${c.dest[i].p}%)</span><p>${d[1]}</p></div>`).join('')}</div>
  <div class="sabia"><h2>Você sabia?</h2><p>No Brasil, a maior arrecadação vem do consumo diário (embutido nos produtos) e não do Imposto de Renda. Por isso, quem ganha menos paga proporcionalmente mais.</p></div>`;
}
const FAQ=[['Não declaro Imposto de Renda. Mesmo assim pago imposto?','Sim. Impostos sobre consumo como ICMS e PIS/COFINS já vêm embutidos no preço de quase tudo que você compra, então todo mundo que consome paga, mesmo sem declarar Imposto de Renda.'],['Por que pedir CPF na Nota Fiscal é importante?','O CPF vincula a compra a você. Isso ajuda a comprovar a compra, garantir direitos de troca e garantia, e em vários estados gera créditos e sorteios dos programas de incentivo. Também ajuda o fisco a combater a sonegação.'],['O que são ICMS, PIS/COFINS e IPI?','ICMS é o imposto estadual sobre circulação de mercadorias e serviços. PIS e COFINS são contribuições federais que incidem sobre a receita das empresas. IPI é o imposto federal sobre produtos industrializados, cobrado da indústria e repassado ao preço final.']];
function vLearn(){
  return `<div class="l1"><h2>Educação Fiscal Simplificada</h2><p>Tudo explicado em linguagem cotidiana, sem termos difíceis ou burocráticas.</p></div>
  <div class="l2"><h2>COMO FUNCIONA A ARRECADAÇÃO</h2><p>Quando você compra um produto, a loja já inclui no preço final os impostos municipais, estaduais e federais. O comerciante recolhe esse valor e repassa aos cofres públicos para financiar serviços essenciais.</p></div>
  <h3 class="fh">Perguntas Frequentes (FAQ)</h3>
  ${FAQ.map((f,i)=>`<div class="faq ${S.faq===i?'open':''}"><button data-q="${i}"><span>${f[0]}</span><svg viewBox="0 0 24 24"><path d="M4 8l8 8 8-8" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="ans">${f[1]}</div></div>`).join('')}`;
}
function render(){
  $('#login').style.display=S.user?'none':'block';
  $('#hn').textContent=S.user||'Visitante';
  if(!S.user){return}
  $('#main').innerHTML={scan:vScan,nota:vNota,dest:vDest,learn:vLearn}[S.tab]();
  
  requestAnimationFrame(()=>document.querySelectorAll('.kb i').forEach(i=>i.style.width=i.dataset.w));
  if(S.tab==='scan'&&S.stream){const v=$('#vid');v.hidden=false;v.srcObject=S.stream;v.play().catch(()=>{});$('#qrbox img').style.display='none'}
}
function go(t){if(t!=='scan')stopCam();S.tab=t;S.hint='';render();$('#main').scrollTop=0}

/* câmera + leitura */
let timer=null;
function stopCam(){clearInterval(timer);if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
function extrairChave(txt){const m=String(txt).replace(/\D/g,' ').match(/\d{44}/);return m?m[0]:null}
function aceitar(chave,demo){
  if(!/^\d{44}$/.test(chave)){S.hint='A chave precisa ter 44 números.';render();return}
  stopCam();addNota(buildNota(chave,demo));S.tab='nota';render();
}
async function toggleCam(){
  if(S.stream){stopCam();render();return}
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    S.hint='Aponte para o QR Code da nota…';render();
    if('BarcodeDetector' in window){
      const bd=new BarcodeDetector({formats:['qr_code']});
      timer=setInterval(async()=>{try{const r=await bd.detect($('#vid'));if(r.length){const c=extrairChave(r[0].rawValue);if(c)aceitar(c);else toast('QR lido, mas não parece uma NFC-e')}}catch(e){}},500);
    }else{S.hint='Câmera ativa, mas este navegador não lê QR. Digite a chave abaixo.';render()}
  }catch(e){S.stream=null;S.hint='Não foi possível abrir a câmera. Digite a chave de acesso.';render()}
}

/* eventos */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t)return go(t.dataset.t);
  const nt=e.target.closest('.nota');if(nt){S.sel=nt.dataset.id;return go('nota')}
  const q=e.target.closest('[data-q]');if(q){S.faq=S.faq===+q.dataset.q?-1:+q.dataset.q;const y=$('#main').scrollTop;render();$('#main').scrollTop=y;return}
  const id=e.target.id;
  if(id==='goDest')go('dest');
  else if(id==='cam'||e.target.closest('#cam'))toggleCam();
  else if(id==='buscar')aceitar(($('#chave').value||'').replace(/\D/g,''));
  else if(id==='demo'){const k='35261100000000000000650010000000011000000019';aceitar(k,true)}
  else if(id==='sair'){if(!confirm('Sair da conta?'))return;stopCam();S.user=null;store.set('pov_user',null);S.tab='scan';render()}
  else if(id==='entrar')entrar();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(!S.user)entrar();else if(e.target.id==='chave')aceitar(e.target.value.replace(/\D/g,''))}});
function entrar(){
  const l=$('#lg').value.trim(),s=$('#sn').value;
  if(!l||!s){$('#err').textContent='Preencha login e senha.';return}
  if(s.length<4){$('#err').textContent='A senha precisa ter ao menos 4 caracteres.';return}
  $('#err').textContent='';S.user=l;store.set('pov_user',l);$('#sn').value='';render();
}
/* olhos seguem o dedo/cursor */
document.addEventListener('pointermove',e=>{
  const fs=parseFloat(getComputedStyle(document.documentElement).fontSize);
  document.querySelectorAll('.pp').forEach(i=>{const r=i.parentElement.getBoundingClientRect();const cx=r.left+i.offsetLeft+i.offsetWidth/2,cy=r.top+i.offsetTop+i.offsetHeight/2;const dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy)||1,k=Math.min(5.5*fs,d/6);i.style.transform=`translate(${dx/d*k}px,${dy/d*k}px)`});
});
render();
</script>
</body>
</html>
